<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Documentação da API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
  <style>
    body { margin: 0; background: #f4f4f4; }
  </style>
</head>
<body>
<div id="swagger-ui"></div>

<script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
<script>
const spec = {
  openapi: "3.0.0",
  info: {
    title: "API de Usuários, Agendamentos e Serviços",
    version: "1.0.0",
    description: "Documentação interativa para o backend"
  },
  servers: [{ url: "http://localhost:3001" }],
  paths: {
    "/usuarios/login": {
      post: {
        summary: "Login de usuário",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  email: { type: "string" },
                  senha: { type: "string" }
                }
              }
            }
          }
        },
        responses: {
          200: { description: "Login realizado com sucesso" },
          400: { description: "Campos obrigatórios ausentes" },
          401: { description: "Senha incorreta" },
          404: { description: "Usuário não encontrado" }
        }
      }
    },
    "/usuarios": {
      get: {
        summary: "Listar todos os usuários",
        responses: { 200: { description: "Lista de usuários" } }
      }
    },
    "/usuario/{id}": {
      get: {
        summary: "Buscar usuário por ID",
        parameters: [
          { name: "id", in: "path", required: true, schema: { type: "integer" } }
        ],
        responses: {
          200: { description: "Usuário encontrado" },
          404: { description: "Usuário não encontrado" }
        }
      }
    },
    "/usuario/inserir": {
      post: {
        summary: "Criar novo usuário",
        requestBody: {
          required: true,
          content: {
            "multipart/form-data": {
              schema: {
                type: "object",
                properties: {
                  nome: { type: "string" },
                  email: { type: "string" },
                  senha: { type: "string" },
                  tipoUsuario: { type: "string" },
                  foto: { type: "string", format: "binary" }
                }
              }
            }
          }
        },
        responses: { 201: { description: "Usuário criado" } }
      }
    },
    "/usuario/{id}/atualizar": {
      put: {
        summary: "Atualizar usuário",
        parameters: [
          { name: "id", in: "path", required: true, schema: { type: "integer" } }
        ],
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  nome: { type: "string" },
                  email: { type: "string" },
                  senha: { type: "string" },
                  tipoUsuario: { type: "string" }
                }
              }
            }
          }
        },
        responses: { 200: { description: "Usuário atualizado" } }
      }
    },
    "/usuario/{id}/deletar": {
      delete: {
        summary: "Deletar usuário",
        parameters: [
          { name: "id", in: "path", required: true, schema: { type: "integer" } }
        ],
        responses: { 200: { description: "Usuário deletado" } }
      }
    },
    "/agendamentos": {
      get: {
        summary: "Listar agendamentos",
        responses: { 200: { description: "Lista de agendamentos" } }
      }
    },
    "/agendamento/inserir": {
      post: {
        summary: "Criar novo agendamento",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  usuarioId: { type: "integer" },
                  servicoId: { type: "integer" },
                  data: { type: "string", format: "date-time" }
                }
              }
            }
          }
        },
        responses: { 201: { description: "Agendamento criado" } }
      }
    },
    "/servicos": {
      get: {
        summary: "Listar serviços",
        responses: { 200: { description: "Lista de serviços" } }
      }
    },
    "/servico/inserir": {
      post: {
        summary: "Criar novo serviço",
        requestBody: {
          required: true,
          content: {
            "application/json": {
              schema: {
                type: "object",
                properties: {
                  nome: { type: "string" },
                  descricao: { type: "string" },
                  preco: { type: "number" }
                }
              }
            }
          }
        },
        responses: { 201: { description: "Serviço criado" } }
      }
    }
  }
};

SwaggerUIBundle({ spec, dom_id: '#swagger-ui' });
</script>
</body>
</html>
